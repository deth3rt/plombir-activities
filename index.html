<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ПЛОМБИР YOUNG 2026 | АКТИВНОСТИ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#7c4dff',
              pink: '#ff2a74',
              cyan: '#00f2fe',
              darkBg: '#0b0c10',
              cardBg: '#13151c',
              cardUsed: '#0d0e13',
              truth: '#00e676',
              false: '#ff1744',
              gold: '#ffd700'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'pop': 'pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)',
            'shake': 'shake 0.4s ease-in-out',
            'glow': 'glow 2s ease-in-out infinite',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55)'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' }
            },
            pop: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '50%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%': { transform: 'translateX(-8px)' },
              '75%': { transform: 'translateX(8px)' }
            },
            glow: {
              '0%, 100%': { boxShadow: '0 0 20px rgba(124, 77, 255, 0.5)' },
              '50%': { boxShadow: '0 0 40px rgba(255, 42, 116, 0.8)' }
            },
            slideUp: {
              '0%': { transform: 'translateY(40px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' }
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      overscroll-behavior: none;
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Neon text effect */
    .neon-text {
      text-shadow: 
        0 0 10px rgba(124, 77, 255, 0.8),
        0 0 20px rgba(255, 42, 116, 0.6),
        0 0 30px rgba(0, 242, 254, 0.4);
    }
    
    /* Glassmorphism */
    .glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>

<body class="bg-brand-darkBg text-gray-100 font-sans min-h-screen antialiased selection:bg-brand-purple overflow-x-hidden">

  <!-- ==================== BACKGROUND ==================== -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-brand-purple/30 blur-[120px] animate-float"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-brand-pink/30 blur-[120px] animate-float" style="animation-delay: 1.5s"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] rounded-full bg-brand-cyan/15 blur-[100px]"></div>
    
    <!-- Sparkles -->
    <div class="absolute top-20 right-10 text-2xl opacity-30 animate-float" style="animation-delay: 0.5s">✨</div>
    <div class="absolute top-40 left-8 text-xl opacity-20 animate-float" style="animation-delay: 1s">⭐</div>
    <div class="absolute bottom-40 right-16 text-2xl opacity-30 animate-float" style="animation-delay: 2s">💫</div>
  </div>

  <!-- ==================== MAIN ==================== -->
  <main class="relative z-10 px-4 py-8 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="text-center mb-8 animate-pop">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-[28px] bg-gradient-to-tr from-brand-purple via-brand-pink to-brand-cyan shadow-2xl shadow-brand-purple/50 mb-5 animate-float">
        <span class="text-5xl">⚡</span>
      </div>
      
      <h1 class="text-4xl font-black tracking-tight mb-2">
        <span class="bg-gradient-to-r from-brand-cyan via-white to-brand-pink bg-clip-text text-transparent neon-text">
          ПЛОМБИР
        </span>
        <br>
        <span class="text-2xl bg-gradient-to-r from-brand-pink via-brand-purple to-brand-cyan bg-clip-text text-transparent">
          YOUNG
        </span>
      </h1>
      
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-gray-900/60 border border-gray-800 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <p class="text-xs text-gray-300 font-bold">
          🎉 Выбери активность
        </p>
      </div>
    </header>

    <!-- ACTIVITIES -->
    <div id="activitiesList" class="grid gap-4 max-w-md mx-auto w-full">
      <!-- Dynamically generated -->
    </div>

    <!-- ADMIN -->
    <div class="max-w-md mx-auto w-full mt-6">
      <button onclick="openAdminLogin()" 
              class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-gray-900/60 hover:bg-gray-800/80 border border-gray-800 hover:border-brand-purple/50 rounded-2xl text-gray-400 hover:text-brand-purple transition-all active:scale-95">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span class="text-xs font-bold uppercase tracking-widest">Админ-панель</span>
      </button>
    </div>

    <!-- FOOTER -->
    <footer class="mt-auto pt-10 text-center">
      <p class="text-[10px] text-gray-600 font-medium">
        ПЛОМБИР YOUNG © 2026 · v1.0 · Made with 💜
      </p>
    </footer>

  </main>

  <!-- ==================== PASSWORD MODAL ==================== -->
  <div id="passwordModal" class="fixed inset-0 z-[100] hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closePasswordModal()"></div>
    
    <!-- Modal -->
    <div class="relative flex items-center justify-center min-h-screen p-4">
      <div id="passwordModalContent" class="w-full max-w-sm bg-brand-cardBg border border-gray-800 rounded-3xl p-6 shadow-2xl animate-slide-up">
        
        <!-- Icon -->
        <div class="text-center mb-5">
          <div id="modalEmoji" class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-brand-purple to-brand-pink shadow-xl shadow-brand-purple/40 text-4xl mb-4">
            🔒
          </div>
          <h2 class="text-xl font-black text-white mb-1">ВВЕДИТЕ ПАРОЛЬ</h2>
          <p id="modalActivityName" class="text-sm text-gray-400">для входа в активность</p>
        </div>

        <!-- Input -->
        <div class="relative mb-3">
          <input 
            type="password" 
            id="passwordInput" 
            placeholder="••••••••"
            autocomplete="off"
            onkeydown="if(event.key === 'Enter') submitPassword()"
            class="w-full bg-gray-900 border-2 border-gray-800 rounded-2xl px-4 py-3.5 text-center text-lg font-bold tracking-widest text-white placeholder-gray-600 focus:outline-none focus:border-brand-purple transition"
          >
          <button onclick="togglePasswordVisibility()" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-500 hover:text-gray-300 transition">
            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Error -->
        <div id="passwordError" class="hidden mb-3 px-4 py-2 bg-rose-500/10 border border-rose-500/30 rounded-xl text-center">
          <p class="text-xs font-bold text-rose-400">❌ Неверный пароль</p>
        </div>

        <!-- Buttons -->
        <div class="space-y-2">
          <button onclick="submitPassword()" 
                  class="w-full py-3.5 bg-gradient-to-r from-brand-purple to-brand-pink text-white font-black rounded-2xl shadow-lg shadow-brand-purple/40 active:scale-95 transition">
            🚀 ВОЙТИ
          </button>
          <button onclick="closePasswordModal()" 
                  class="w-full py-3 bg-gray-900 hover:bg-gray-800 text-gray-400 font-bold rounded-2xl border border-gray-800 active:scale-95 transition">
            ОТМЕНА
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ==================== AUDIO ENGINE ==================== -->
  <script>
    const AudioEngine = {
      ctx: null,
      
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      
      playTone(freq, duration = 0.1, type = 'sine', volume = 0.1) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      
      tap() {
        this.playTone(660, 0.08, 'sine', 0.08);
      },
      
      success() {
        this.playTone(523.25, 0.1, 'triangle', 0.12);
        setTimeout(() => this.playTone(659.25, 0.1, 'triangle', 0.12), 100);
        setTimeout(() => this.playTone(783.99, 0.2, 'triangle', 0.12), 200);
      },
      
      error() {
        this.playTone(220, 0.15, 'sawtooth', 0.1);
        setTimeout(() => this.playTone(180, 0.2, 'sawtooth', 0.1), 100);
      }
    };
  </script>

  <!-- ==================== STORAGE ==================== -->
  <script>
    // ==================== DEFAULT CONFIG ====================
    const DEFAULT_ACTIVITIES = [
      {
        id: 'lipkiy',
        name: 'ЛИПКИЙ',
        emoji: '🧩',
        description: 'Дартс. 3 броска. 0–100 очков',
        password: 'lipkiy2026',
        url: 'games/lipkiy.html',
        enabled: true,
        gradient: 'from-brand-pink to-orange-400',
        shadow: 'shadow-brand-pink/30'
      },
      {
        id: 'facts',
        name: 'ФАКТЫ!',
        emoji: '📊',
        description: 'Правда или ложь? Блиц-раунд',
        password: 'facts2026',
        url: 'games/facts.html',
        enabled: true,
        gradient: 'from-brand-purple to-brand-cyan',
        shadow: 'shadow-brand-purple/30'
      },
      {
        id: 'v-teme',
        name: 'В ТЕМЕ',
        emoji: '💰',
        description: 'Угадай цену. Дуэль на двоих',
        password: 'tema2026',
        url: 'games/v-teme.html',
        enabled: true,
        gradient: 'from-brand-cyan to-emerald-400',
        shadow: 'shadow-brand-cyan/30'
      }
    ];
    
    const DEFAULT_ADMIN_PASSWORD = 'admin2026';
    
    // ==================== STORAGE ====================
    const Storage = {
      KEYS: {
        ACTIVITIES: 'plombir_activities_v1',
        ADMIN_PASS: 'plombir_admin_pass_v1',
        STATS: 'plombir_stats_v1',
        AUTH_SESSION: 'plombir_auth_session_v1'
      },
      
      getActivities() {
        try {
          const data = localStorage.getItem(this.KEYS.ACTIVITIES);
          if (!data) {
            this.saveActivities(DEFAULT_ACTIVITIES);
            return [...DEFAULT_ACTIVITIES];
          }
          return JSON.parse(data);
        } catch(e) {
          return [...DEFAULT_ACTIVITIES];
        }
      },
      
      saveActivities(activities) {
        try {
          localStorage.setItem(this.KEYS.ACTIVITIES, JSON.stringify(activities));
        } catch(e) {}
      },
      
      getAdminPassword() {
        try {
          return localStorage.getItem(this.KEYS.ADMIN_PASS) || DEFAULT_ADMIN_PASSWORD;
        } catch(e) {
          return DEFAULT_ADMIN_PASSWORD;
        }
      },
      
      setAdminPassword(pwd) {
        try {
          localStorage.setItem(this.KEYS.ADMIN_PASS, pwd);
        } catch(e) {}
      },
      
      // Session-based auth (на 30 минут)
      setAuthSession(activityId) {
        try {
          const session = JSON.parse(localStorage.getItem(this.KEYS.AUTH_SESSION) || '{}');
          session[activityId] = Date.now() + (30 * 60 * 1000); // 30 минут
          localStorage.setItem(this.KEYS.AUTH_SESSION, JSON.stringify(session));
        } catch(e) {}
      },
      
      isAuthValid(activityId) {
        try {
          const session = JSON.parse(localStorage.getItem(this.KEYS.AUTH_SESSION) || '{}');
          const expiry = session[activityId];
          if (!expiry) return false;
          if (Date.now() > expiry) {
            delete session[activityId];
            localStorage.setItem(this.KEYS.AUTH_SESSION, JSON.stringify(session));
            return false;
          }
          return true;
        } catch(e) {
          return false;
        }
      },
      
      clearAuthSession() {
        try {
          localStorage.removeItem(this.KEYS.AUTH_SESSION);
        } catch(e) {}
      }
    };
  </script>

  <!-- ==================== UI LOGIC ==================== -->
  <script>
    let currentActivity = null;
    let passwordVisible = false;
    
    // ==================== RENDER ====================
    function renderActivities() {
      const container = document.getElementById('activitiesList');
      const activities = Storage.getActivities().filter(a => a.enabled);
      
      if (activities.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 animate-pop">
            <div class="text-5xl mb-3">😢</div>
            <p class="text-gray-400 font-bold">Активности пока не добавлены</p>
            <p class="text-xs text-gray-500 mt-1">Зайди в админ-панель</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = activities.map((act, idx) => `
        <button 
          onclick="handleActivityClick('${act.id}')"
          class="group relative bg-brand-cardBg border border-gray-800 rounded-3xl p-5 shadow-xl hover:border-brand-purple/60 hover:shadow-brand-purple/20 transition-all duration-300 active:scale-95 text-left animate-pop"
          style="animation-delay: ${idx * 0.1}s">
          
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${act.gradient || 'from-brand-purple to-brand-pink'} flex items-center justify-center text-3xl shadow-lg ${act.shadow || 'shadow-brand-purple/30'} group-hover:scale-110 transition-transform">
              ${act.emoji || '🎮'}
            </div>
            
            <div class="flex-1 min-w-0">
              <h2 class="text-lg font-black text-white mb-0.5 truncate">${act.name}</h2>
              <p class="text-xs text-gray-400 truncate">${act.description || ''}</p>
            </div>
            
            <i data-lucide="chevron-right" class="w-5 h-5 text-gray-500 group-hover:text-brand-purple group-hover:translate-x-1 transition-all flex-shrink-0"></i>
          </div>
        </button>
      `).join('');
      
      lucide.createIcons();
    }
    
    // ==================== ACTIVITY CLICK ====================
    function handleActivityClick(activityId) {
      AudioEngine.tap();
      
      const activities = Storage.getActivities();
      const activity = activities.find(a => a.id === activityId);
      if (!activity) return;
      
      // Если сессия уже активна — пускаем сразу
      if (Storage.isAuthValid(activityId)) {
        goToActivity(activity);
        return;
      }
      
      // Иначе — попап пароля
      currentActivity = activity;
      openPasswordModal();
    }
    
    function goToActivity(activity) {
      if (activity.url) {
        window.location.href = activity.url;
      }
    }
    
    // ==================== PASSWORD MODAL ====================
    function openPasswordModal() {
      if (!currentActivity) return;
      
      document.getElementById('modalEmoji').innerText = currentActivity.emoji || '🔒';
      document.getElementById('modalActivityName').innerText = `для входа в «${currentActivity.name}»`;
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordError').classList.add('hidden');
      document.getElementById('passwordModal').classList.remove('hidden');
      
      // Фокус на поле (с задержкой для мобилок)
      setTimeout(() => {
        document.getElementById('passwordInput').focus();
      }, 100);
      
      lucide.createIcons();
    }
    
    function closePasswordModal() {
      document.getElementById('passwordModal').classList.add('hidden');
      currentActivity = null;
      passwordVisible = false;
      document.getElementById('passwordInput').type = 'password';
      document.getElementById('eyeIcon').setAttribute('data-lucide', 'eye');
      lucide.createIcons();
    }
    
    function submitPassword() {
      if (!currentActivity) return;
      
      const input = document.getElementById('passwordInput').value;
      const errorEl = document.getElementById('passwordError');
      const modalContent = document.getElementById('passwordModalContent');
      
      if (input === currentActivity.password) {
        // Успех
        AudioEngine.success();
        Storage.setAuthSession(currentActivity.id);
        
        // Анимация успеха
        modalContent.style.transform = 'scale(0.95)';
        modalContent.style.opacity = '0';
        setTimeout(() => {
          goToActivity(currentActivity);
        }, 300);
      } else {
        // Ошибка
        AudioEngine.error();
        errorEl.classList.remove('hidden');
        modalContent.classList.add('animate-shake');
        setTimeout(() => modalContent.classList.remove('animate-shake'), 400);
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }
    
    function togglePasswordVisibility() {
      passwordVisible = !passwordVisible;
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      
      input.type = passwordVisible ? 'text' : 'password';
      icon.setAttribute('data-lucide', passwordVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    }
    
    // ==================== ADMIN LOGIN ====================
    function openAdminLogin() {
      AudioEngine.tap();
      
      const pwd = prompt('🔐 Введите пароль администратора:');
      if (pwd === null) return;
      
      if (pwd === Storage.getAdminPassword()) {
        AudioEngine.success();
        Storage.setAuthSession('admin');
        window.location.href = 'admin.html';
      } else {
        AudioEngine.error();
        alert('❌ Неверный пароль администратора');
      }
    }
    
    // ==================== INIT ====================
    window.addEventListener('DOMContentLoaded', () => {
      // Telegram
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0b0c10');
  tg.setBackgroundColor('#0b0c10');
}
      
      // Render
      renderActivities();
      lucide.createIcons();
      
      // Закрытие модалки по Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePasswordModal();
      });
    });
  </script>

</body>
