  <script>
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      tone(freq, dur = 0.1, type = 'sine', vol = 0.1) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      },
      tap() { this.tone(660, 0.08); },
      success() {
        this.tone(523.25, 0.1, 'triangle', 0.12);
        setTimeout(() => this.tone(659.25, 0.1, 'triangle', 0.12), 100);
        setTimeout(() => this.tone(783.99, 0.2, 'triangle', 0.12), 200);
      },
      error() {
        this.tone(220, 0.15, 'sawtooth', 0.1);
        setTimeout(() => this.tone(180, 0.2, 'sawtooth', 0.1), 100);
      }
    };
  </script>

  <!-- ==================== STORAGE ==================== -->
  <script>
    const DEFAULT_ACTIVITIES = [
      { id: 'lipkiy', name: 'ЛИПКИЙ', emoji: '🧩', description: 'Дартс. 3 броска. 0–100 очков', password: 'lipkiy2026', url: 'games/lipkiy.html', enabled: true, gradient: 'from-brand-pink to-orange-400' },
      { id: 'facts', name: 'ФАКТЫ!', emoji: '📊', description: 'Правда или ложь? Блиц-раунд', password: 'facts2026', url: 'games/facts.html', enabled: true, gradient: 'from-brand-purple to-brand-cyan' },
      { id: 'v-teme', name: 'В ТЕМЕ', emoji: '💰', description: 'Угадай цену. Дуэль на двоих', password: 'tema2026', url: 'games/v-teme.html', enabled: true, gradient: 'from-brand-cyan to-emerald-400' }
    ];
    
    const DEFAULT_ADMIN_PASSWORD = 'admin2026';
    
    const GRADIENTS = [
      'from-brand-purple to-brand-pink',
      'from-brand-pink to-orange-400',
      'from-brand-purple to-brand-cyan',
      'from-brand-cyan to-emerald-400',
      'from-emerald-400 to-yellow-400',
      'from-yellow-400 to-brand-pink',
      'from-rose-500 to-brand-purple',
      'from-blue-500 to-brand-cyan'
    ];

    const Storage = {
      KEYS: {
        ACTIVITIES: 'plombir_activities_v1',
        ADMIN_PASS: 'plombir_admin_pass_v1',
        STATS: 'plombir_stats_v1',
        AUTH_SESSION: 'plombir_auth_session_v1'
      },
      
      getActivities() {
        try {
          const data = localStorage.getItem(this.KEYS.ACTIVITIES);
          if (!data) {
            this.saveActivities(DEFAULT_ACTIVITIES);
            return [...DEFAULT_ACTIVITIES];
          }
          return JSON.parse(data);
        } catch(e) { return [...DEFAULT_ACTIVITIES]; }
      },
      
      saveActivities(activities) {
        try { localStorage.setItem(this.KEYS.ACTIVITIES, JSON.stringify(activities)); } catch(e) {}
      },
      
      getAdminPassword() {
        try { return localStorage.getItem(this.KEYS.ADMIN_PASS) || DEFAULT_ADMIN_PASSWORD; }
        catch(e) { return DEFAULT_ADMIN_PASSWORD; }
      },
      
      setAdminPassword(pwd) {
        try { localStorage.setItem(this.KEYS.ADMIN_PASS, pwd); } catch(e) {}
      },
      
      getStats() {
        try {
          const data = localStorage.getItem(this.KEYS.STATS);
          return data ? JSON.parse(data) : {};
        } catch(e) { return {}; }
      },
      
      saveStats(stats) {
        try { localStorage.setItem(this.KEYS.STATS, JSON.stringify(stats)); } catch(e) {}
      },
      
      setAuthSession(activityId) {
        try {
          const session = JSON.parse(localStorage.getItem(this.KEYS.AUTH_SESSION) || '{}');
          session[activityId] = Date.now() + (30 * 60 * 1000);
          localStorage.setItem(this.KEYS.AUTH_SESSION, JSON.stringify(session));
        } catch(e) {}
      },
      
      isAuthValid(activityId) {
        try {
          const session = JSON.parse(localStorage.getItem(this.KEYS.AUTH_SESSION) || '{}');
          const expiry = session[activityId];
          if (!expiry) return false;
          if (Date.now() > expiry) {
            delete session[activityId];
            localStorage.setItem(this.KEYS.AUTH_SESSION, JSON.stringify(session));
            return false;
          }
          return true;
        } catch(e) { return false; }
      },
      
      clearAuthSession() {
        try { localStorage.removeItem(this.KEYS.AUTH_SESSION); } catch(e) {}
      }
    };
  </script>

  <script>
    let editingActivityId = null;
    let editingEnabled = true;
    let selectedGradient = GRADIENTS[0];
    
    // ==================== AUTH ====================
    function checkAdminAuth() {
      const input = document.getElementById('adminPassInput').value;
      const errorEl = document.getElementById('authError');
      
      if (input === Storage.getAdminPassword()) {
        AudioEngine.success();
        Storage.setAuthSession('admin');
        document.getElementById('authGuard').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        initAdmin();
      } else {
        AudioEngine.error();
        errorEl.classList.remove('hidden');
        const guard = document.getElementById('authGuard').querySelector('div');
        guard.classList.add('animate-shake');
        setTimeout(() => guard.classList.remove('animate-shake'), 400);
        document.getElementById('adminPassInput').value = '';
      }
    }
    
    function lockAdmin() {
      if (!confirm('Заблокировать админ-панель?')) return;
      Storage.clearAuthSession();
      window.location.href = 'index.html';
    }
    
    // ==================== INIT ====================
    function initAdmin() {
      switchTab('stats');

      renderActivitiesAdmin();
      renderPasswords();

    // ==================== TABS ====================
    function switchTab(tab) {
      AudioEngine.tap();

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      
      document.querySelectorAll('[id^="tabBtn-"]').forEach(btn => {
        btn.className = "flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap text-gray-500 hover:text-gray-300";
      });
      
      const activeBtn = document.getElementById(`tabBtn-${tab}`);
      activeBtn.className = "flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap bg-brand-purple text-white shadow-lg shadow-brand-purple/30";
      
      if (tab === 'stats') renderStats();
      if (tab === 'activities') renderActivitiesAdmin();
      if (tab === 'passwords') renderPasswords();
      
      lucide.createIcons();
    }
    
    // ==================== STATS ====================
    function renderStats() {
      const container = document.getElementById('statsContainer');
      const stats = Storage.getStats();
      const activities = Storage.getActivities();
      
      let totalPlayers = 0;
      let totalSessions = 0;
      
      const html = activities.map(act => {
        const data = stats[act.id] || { sessions: [], players: [] };
        const sessionsCount = data.sessions?.length || 0;
        const playersCount = data.players?.length || 0;
        
        totalPlayers += playersCount;
        totalSessions += sessionsCount;
        
        // Вычисляем лучший результат
        let bestResult = '—';
        let avgResult = '—';
        
        if (act.id === 'lipkiy' && data.sessions?.length > 0) {
          const scores = data.sessions.map(s => s.score || 0);
          const best = Math.max(...scores);
          const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
          bestResult = `${best} очков`;
          avgResult = `${avg} очков`;
        } else if (act.id === 'facts' && data.sessions?.length > 0) {
          const scores = data.sessions.map(s => (s.correct || 0) / (s.total || 5));
          const best = Math.max(...scores);
          const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
          bestResult = `${Math.round(best * 100)}%`;
          avgResult = `${Math.round(avg * 100)}%`;
        } else if (act.id === 'v-teme' && data.sessions?.length > 0) {
          bestResult = `${sessionsCount} игр`;
          avgResult = '—';
        }
        
        return `
          <div class="bg-brand-cardBg border border-gray-800 rounded-3xl p-4 animate-pop">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr ${act.gradient} flex items-center justify-center text-2xl">
                ${act.emoji}
              </div>
              <div class="flex-1">
                <h3 class="font-black text-white text-sm">${act.name}</h3>
                <p class="text-[10px] text-gray-500">${act.enabled ? '✅ Включена' : '❌ Отключена'}</p>
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-gray-900/60 rounded-xl p-2.5 border border-gray-800/60">
                <p class="text-[9px] text-gray-500 font-bold uppercase">Игроков</p>
                <p class="text-lg font-black text-brand-cyan">${playersCount}</p>
              </div>
              <div class="bg-gray-900/60 rounded-xl p-2.5 border border-gray-800/60">
                <p class="text-[9px] text-gray-500 font-bold uppercase">Раундов</p>
                <p class="text-lg font-black text-brand-purple">${sessionsCount}</p>
              </div>
              <div class="bg-gray-900/60 rounded-xl p-2.5 border border-gray-800/60">
                <p class="text-[9px] text-gray-500 font-bold uppercase">Лучший</p>
                <p class="text-sm font-black text-brand-gold">${bestResult}</p>
              </div>
              <div class="bg-gray-900/60 rounded-xl p-2.5 border border-gray-800/60">
                <p class="text-[9px] text-gray-500 font-bold uppercase">Средний</p>
                <p class="text-sm font-black text-emerald-400">${avgResult}</p>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      // Общая сводка
      const summaryHtml = `
        <div class="bg-gradient-to-tr from-brand-purple/20 to-brand-pink/20 border border-brand-purple/40 rounded-3xl p-4 mb-2 animate-pop">
          <h3 class="font-black text-white text-xs uppercase tracking-wider mb-3">📊 ОБЩАЯ СВОДКА</h3>
          <div class="grid grid-cols-3 gap-2">
            <div class="text-center">
              <p class="text-2xl font-black text-brand-cyan">${totalPlayers}</p>
              <p class="text-[9px] text-gray-400 font-bold uppercase">Игроков</p>
            </div>
            <div class="text-center">
              <p class="text-2xl font-black text-brand-pink">${totalSessions}</p>
              <p class="text-[9px] text-gray-400 font-bold uppercase">Раундов</p>
            </div>
            <div class="text-center">
              <p class="text-2xl font-black text-brand-purple">${activities.length}</p>
              <p class="text-[9px] text-gray-400 font-bold uppercase">Активностей</p>
            </div>
          </div>
        </div>
      `;
      
      if (activities.length === 0) {
        container.innerHTML = `<div class="text-center py-16"><p class="text-gray-500 text-sm">Нет активностей</p></div>`;
      } else {
        container.innerHTML = summaryHtml + html;
      }
      
      lucide.createIcons();
    }
    
    // ==================== ACTIVITIES ADMIN ====================
    function renderActivitiesAdmin() {
      const container = document.getElementById('activitiesContainer');
      const activities = Storage.getActivities();
      
      if (activities.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 animate-pop">
            <div class="text-5xl mb-3">🎮</div>
            <p class="text-gray-400 font-bold text-sm">Активностей пока нет</p>
            <p class="text-xs text-gray-500 mt-1">Добавь первую!</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = activities.map(act => `
        <div class="bg-brand-cardBg border border-gray-800 rounded-3xl p-4 animate-pop">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr ${act.gradient} flex items-center justify-center text-2xl shadow-lg">
              ${act.emoji}
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-black text-white text-sm truncate">${act.name}</h3>
              <p class="text-[10px] text-gray-500 truncate">${act.description || '—'}</p>
            </div>
            <button onclick="toggleActivityEnabled('${act.id}')" 
                    class="w-10 h-6 rounded-full transition relative ${act.enabled ? 'bg-emerald-500' : 'bg-gray-700'}">
              <span class="absolute top-0.5 ${act.enabled ? 'left-[18px]' : 'left-0.5'} w-5 h-5 rounded-full bg-white shadow transition-all"></span>
            </button>
          </div>
          
          <div class="flex gap-2">
            <button onclick="openEditActivity('${act.id}')" 
                    class="flex-1 py-2.5 bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-brand-purple text-gray-300 hover:text-brand-purple font-bold text-xs rounded-xl transition active:scale-95">
              ✏️ РЕДАКТИРОВАТЬ
            </button>
            <button onclick="testActivity('${act.id}')" 
                    class="px-3 py-2.5 bg-gray-900 hover:bg-gray-800 border border-gray-800 hover:border-brand-cyan text-gray-300 hover:text-brand-cyan font-bold text-xs rounded-xl transition active:scale-95">
              🚀
            </button>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }
    
    function toggleActivityEnabled(id) {
      AudioEngine.tap();
      const activities = Storage.getActivities();
      const act = activities.find(a => a.id === id);
      if (!act) return;
      act.enabled = !act.enabled;
      Storage.saveActivities(activities);
      renderActivitiesAdmin();
      renderStats();
    }
    
    function testActivity(id) {
      AudioEngine.tap();
      const activities = Storage.getActivities();
      const act = activities.find(a => a.id === id);
      if (!act) return;
      if (!act.url) {
        alert('❌ У активности нет URL');
        return;
      }
      window.open(act.url, '_blank');
    }
    
    // ==================== EDIT ACTIVITY ====================
    function openAddActivity() {
      AudioEngine.tap();
      editingActivityId = null;
      editingEnabled = true;
      selectedGradient = GRADIENTS[0];
      
      document.getElementById('activityModalTitle').innerText = '➕ НОВАЯ АКТИВНОСТЬ';
      document.getElementById('editActivityName').value = '';
      document.getElementById('editActivityEmoji').value = '🎮';
      document.getElementById('editActivityDesc').value = '';
      document.getElementById('editActivityPassword').value = '';
      document.getElementById('editActivityUrl').value = 'games/';
      document.getElementById('deleteActivityBtn').style.display = 'none';
      
      renderGradientPicker();
      updateEnabledToggle();
      
      document.getElementById('activityModal').classList.remove('hidden');
      lucide.createIcons();
    }
    
    function openEditActivity(id) {
      AudioEngine.tap();
      const activities = Storage.getActivities();
      const act = activities.find(a => a.id === id);
      if (!act) return;
      
      editingActivityId = id;
      editingEnabled = act.enabled;
      selectedGradient = act.gradient || GRADIENTS[0];
      
      document.getElementById('activityModalTitle').innerText = '✏️ РЕДАКТИРОВАТЬ';
      document.getElementById('editActivityName').value = act.name;
      document.getElementById('editActivityEmoji').value = act.emoji;
      document.getElementById('editActivityDesc').value = act.description || '';
      document.getElementById('editActivityPassword').value = act.password;
      document.getElementById('editActivityUrl').value = act.url || '';
      document.getElementById('deleteActivityBtn').style.display = 'flex';
      
      renderGradientPicker();
      updateEnabledToggle();
      
      document.getElementById('activityModal').classList.remove('hidden');
      lucide.createIcons();
    }
    
    function closeActivityModal() {
      document.getElementById('activityModal').classList.add('hidden');
      editingActivityId = null;
    }
    
    function renderGradientPicker() {
      const container = document.getElementById('gradientPicker');
      container.innerHTML = GRADIENTS.map(g => `
        <button onclick="selectGradient('${g}')" 
                class="h-10 rounded-xl bg-gradient-to-tr ${g} border-2 transition ${selectedGradient === g ? 'border-white scale-110' : 'border-transparent opacity-60'}">
        </button>
      `).join('');
    }
    
    function selectGradient(g) {
      AudioEngine.tap();
      selectedGradient = g;
      renderGradientPicker();
    }
    
    function toggleEditEnabled() {
      AudioEngine.tap();
      editingEnabled = !editingEnabled;
      updateEnabledToggle();
    }
    
    function updateEnabledToggle() {
      const toggle = document.getElementById('editEnabledToggle');
      const knob = document.getElementById('editEnabledKnob');
      
      if (editingEnabled) {
        toggle.className = "relative w-12 h-6 rounded-full bg-emerald-500 transition";
        knob.className = "absolute top-0.5 left-[18px] w-5 h-5 rounded-full bg-white shadow transition-transform";
      } else {
        toggle.className = "relative w-12 h-6 rounded-full bg-gray-700 transition";
        knob.className = "absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform";
      }
    }
    
    function saveActivity() {
      const name = document.getElementById('editActivityName').value.trim();
      const emoji = document.getElementById('editActivityEmoji').value.trim() || '🎮';
      const desc = document.getElementById('editActivityDesc').value.trim();
      const password = document.getElementById('editActivityPassword').value.trim();
      const url = document.getElementById('editActivityUrl').value.trim();
      
      if (!name || !password || !url) {
        AudioEngine.error();
        alert('❌ Заполни название, пароль и URL');
        return;
      }
      
      const activities = Storage.getActivities();
      
      if (editingActivityId) {
        // Редактирование
        const act = activities.find(a => a.id === editingActivityId);
        if (!act) return;
        act.name = name;
        act.emoji = emoji;
        act.description = desc;
        act.password = password;
        act.url = url;
        act.enabled = editingEnabled;
        act.gradient = selectedGradient;
      } else {
        // Новая
        const newId = 'act_' + Date.now();
        activities.push({
          id: newId,
          name, emoji, description: desc,
          password, url,
          enabled: editingEnabled,
          gradient: selectedGradient
        });
      }
      
      Storage.saveActivities(activities);
      AudioEngine.success();
      closeActivityModal();
      renderActivitiesAdmin();
      renderStats();
      renderPasswords();
    }
    
    function deleteActivity() {
      if (!editingActivityId) return;
      if (!confirm('🗑️ Удалить эту активность? Это действие необратимо.')) return;
      
      const activities = Storage.getActivities().filter(a => a.id !== editingActivityId);
      Storage.saveActivities(activities);
      AudioEngine.success();
      closeActivityModal();
      renderActivitiesAdmin();
      renderStats();
      renderPasswords();
    }
    
    // ==================== PASSWORDS ====================
    function renderPasswords() {
      const container = document.getElementById('passwordsContainer');
      const activities = Storage.getActivities();
      const adminPwd = Storage.getAdminPassword();
      
      const adminHtml = `
        <div class="bg-gradient-to-tr from-brand-purple/20 to-brand-pink/20 border border-brand-purple/40 rounded-3xl p-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-purple to-brand-pink flex items-center justify-center text-xl">
              ⚙️
            </div>
            <div>
              <h3 class="font-black text-white text-sm">АДМИН</h3>
              <p class="text-[10px] text-gray-400">Пароль от панели</p>
            </div>
          </div>
          <div class="flex gap-2">
            <input type="text" id="adminPassField" value="${adminPwd}"
                   class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-brand-purple">
            <button onclick="saveAdminPassword()" 
                    class="px-3 py-2.5 bg-brand-purple/20 hover:bg-brand-purple/30 border border-brand-purple/40 text-brand-purple rounded-xl transition active:scale-95">
              <i data-lucide="save" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
      
      const activitiesHtml = activities.map(act => `
        <div class="bg-brand-cardBg border border-gray-800 rounded-3xl p-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr ${act.gradient} flex items-center justify-center text-xl">
              ${act.emoji}
            </div>
            <div>
              <h3 class="font-black text-white text-sm">${act.name}</h3>
              <p class="text-[10px] text-gray-400">Пароль для входа</p>
            </div>
          </div>
          <div class="flex gap-2">
            <input type="text" id="passField-${act.id}" value="${act.password}"
                   class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-brand-purple">
            <button onclick="saveActivityPassword('${act.id}')" 
                    class="px-3 py-2.5 bg-brand-cyan/20 hover:bg-brand-cyan/30 border border-brand-cyan/40 text-brand-cyan rounded-xl transition active:scale-95">
              <i data-lucide="save" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');
      
      container.innerHTML = adminHtml + activitiesHtml;
      
      // Кнопка сброса паролей
      const resetBtn = `
        <button onclick="resetAllPasswords()" 
                class="w-full py-3 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-400 font-black text-xs rounded-2xl transition active:scale-95 mt-3">
          🔄 СБРОСИТЬ К СТАНДАРТНЫМ
        </button>
      `;
      container.insertAdjacentHTML('beforeend', resetBtn);
      
      lucide.createIcons();
    }
    
    function saveAdminPassword() {
      const newPwd = document.getElementById('adminPassField').value.trim();
      if (!newPwd) { AudioEngine.error(); alert('Пароль не может быть пустым'); return; }
      Storage.setAdminPassword(newPwd);
      AudioEngine.success();
      alert('✅ Пароль администратора сохранён');
    }
    
    function saveActivityPassword(id) {
      const newPwd = document.getElementById(`passField-${id}`).value.trim();
      if (!newPwd) { AudioEngine.error(); alert('Пароль не может быть пустым'); return; }
      
      const activities = Storage.getActivities();
      const act = activities.find(a => a.id === id);
      if (!act) return;
      act.password = newPwd;
      Storage.saveActivities(activities);
      AudioEngine.success();
      alert(`✅ Пароль для «${act.name}» сохранён`);
    }
    
    function resetAllPasswords() {
      if (!confirm('🔄 Сбросить ВСЕ пароли к стандартным?')) return;
      
      const activities = Storage.getActivities();
      const defaultMap = {
        'lipkiy': 'lipkiy2026',
        'facts': 'facts2026',
        'v-teme': 'tema2026'
      };
      
      activities.forEach(act => {
        if (defaultMap[act.id]) act.password = defaultMap[act.id];
      });
      
      Storage.saveActivities(activities);
      Storage.setAdminPassword('admin2026');
      AudioEngine.success();
      renderPasswords();
      alert('✅ Пароли сброшены');
    }
    
    // ==================== EXPORT / IMPORT ====================
    function exportData() {
      AudioEngine.tap();
      
      const data = {
        version: '1.0',
        exportedAt: new Date().toISOString(),
        activities: Storage.getActivities(),
        adminPassword: Storage.getAdminPassword(),
        stats: Storage.getStats()
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `plombir-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      
      AudioEngine.success();
    }
    
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          
          if (!data.activities) throw new Error('Неверный формат');
          
          if (!confirm('📤 Импортировать данные? Текущие данные будут перезаписаны.')) return;
          
          Storage.saveActivities(data.activities);
          if (data.adminPassword) Storage.setAdminPassword(data.adminPassword);
          if (data.stats) Storage.saveStats(data.stats);
          
          AudioEngine.success();
          alert('✅ Данные импортированы!');
          
          renderStats();
          renderActivitiesAdmin();
          renderPasswords();
        } catch(err) {
          AudioEngine.error();
          alert('❌ Ошибка импорта: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
    
    function resetStats() {
      if (!confirm('🔄 Сбросить ВСЮ статистику? Пароли и активности останутся.')) return;
      Storage.saveStats({});
      AudioEngine.success();
      renderStats();
      alert('✅ Статистика сброшена');
    }
    
    function resetAll() {
      if (!confirm('🗑️ СБРОСИТЬ ВСЁ? Это удалит активности, пароли и статистику безвозвратно!')) return;
      if (!confirm('⚠️ ТОЧНО ВСЁ? Отменить будет невозможно!')) return;
      
      localStorage.removeItem(Storage.KEYS.ACTIVITIES);
      localStorage.removeItem(Storage.KEYS.ADMIN_PASS);
      localStorage.removeItem(Storage.KEYS.STATS);
      localStorage.removeItem(Storage.KEYS.AUTH_SESSION);
      
      AudioEngine.success();
      alert('✅ Всё сброшено. Страница будет перезагружена.');
      window.location.reload();
    }
    
    // ==================== INIT ====================
    window.addEventListener('DOMContentLoaded', () => {
      // Telegram
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0b0c10');
  tg.setBackgroundColor('#0b0c10');
}
      
      // Если уже авторизован — сразу открываем
      if (Storage.isAuthValid('admin')) {
        document.getElementById('authGuard').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        initAdmin();
      } else {
        setTimeout(() => document.getElementById('adminPassInput')?.focus(), 200);
      }
      
      lucide.createIcons();
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeActivityModal();
      });
    });
  </script>

</body>
